spring:
  application:
    name: scheduled-email

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/scheduled_email}
    username: ${DB_USERNAME:email_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

email:
  scheduler:
    cron: "*/10 * * * * *"
    processing-timeout-minutes: 15
    max-retries: 3
    batch-size: 10

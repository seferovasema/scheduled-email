services:
  postgres:
    image: postgres:17-alpine
    container_name: scheduled-email-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: scheduled_email
      POSTGRES_USER: email_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_user -d scheduled_email"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
